<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0F2B1E"/>

  <!-- Subtle wireframe mesh at 5% opacity -->
  <g opacity="0.05" stroke="#5DCAA5" stroke-width="1" fill="none">
    <polygon points="600,60 1050,270 920,570 280,570 150,270"/>
    <polygon points="600,130 900,290 810,510 390,510 300,290"/>
    <line x1="600" y1="60" x2="600" y2="130"/>
    <line x1="1050" y1="270" x2="900" y2="290"/>
    <line x1="920" y1="570" x2="810" y2="510"/>
    <line x1="280" y1="570" x2="390" y2="510"/>
    <line x1="150" y1="270" x2="300" y2="290"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="275" font-family="Georgia, serif" font-size="72" font-weight="400" fill="#F5F1EB" text-anchor="middle" letter-spacing="2">Fieldcraft Digital</text>

  <!-- Tagline -->
  <text x="600" y="355" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-style="italic" fill="#5DCAA5" text-anchor="middle" letter-spacing="1">Engineered around you.</text>
</svg>
